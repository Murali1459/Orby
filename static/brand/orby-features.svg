<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Orby features</title>
  <desc id="description">One workspace for Aerospike and Redis, native Go clients without external database binaries, and output designed for JSON, tables, raw values, counts, and large results.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset="0.52" stop-color="#0c0c11"/>
      <stop offset="1" stop-color="#11101a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="node-cyan">
      <stop stop-color="#164e63" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-indigo">
      <stop stop-color="#312e81" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node-violet">
      <stop stop-color="#581c87" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="24" fill="url(#panel)" stroke="#27272a" stroke-width="2"/>

  <path d="M70 129C266 75 420 92 600 90s336-17 530 39" fill="none" stroke="#27272a" stroke-width="5" opacity="0.8"/>
  <path d="M70 129C266 75 420 92 600 90s336-17 530 39" fill="none" stroke="url(#orbit)" stroke-width="2.5" filter="url(#soft-glow)"/>

  <g transform="translate(200 99)">
    <circle r="56" fill="url(#node-cyan)" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.5"/>
    <g transform="translate(-19.8 -19.8) scale(1.65)" fill="none" stroke="#67e8f9" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/>
      <path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/>
      <path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>
    </g>
    <path d="M0 56v35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
    <circle cy="100" r="6" fill="#67e8f9"/>
  </g>

  <g transform="translate(600 90)">
    <circle r="56" fill="url(#node-indigo)" stroke="#818cf8" stroke-opacity="0.75" stroke-width="1.5"/>
    <g transform="translate(-19.8 -19.8) scale(1.65)" fill="none" stroke="#a5b4fc" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 19h8"/>
      <path d="m4 17 6-6-6-6"/>
    </g>
    <path d="M0 56v44" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
    <circle cy="109" r="6" fill="#818cf8"/>
  </g>

  <g transform="translate(1000 99)">
    <circle r="56" fill="url(#node-violet)" stroke="#c084fc" stroke-opacity="0.75" stroke-width="1.5"/>
    <g transform="translate(-19.8 -19.8) scale(1.65)" fill="none" stroke="#c4b5fd" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 1-2-2V9m0 0h18"/>
    </g>
    <path d="M0 56v35" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7"/>
    <circle cy="100" r="6" fill="#c084fc"/>
  </g>

  <path d="M400 220v155M800 220v155" stroke="#3f3f46" stroke-width="1"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">
    <g transform="translate(200)">
      <text y="250" fill="#fafafa" font-size="29" font-weight="750" letter-spacing="-0.6">One workspace</text>
      <text y="296" fill="#a1a1aa" font-size="18.5">
        <tspan x="0">Aerospike and Redis share</tspan>
        <tspan x="0" dy="29">connections, history, and</tspan>
        <tspan x="0" dy="29">output tools.</tspan>
      </text>
    </g>

    <g transform="translate(600)">
      <text y="250" fill="#fafafa" font-size="29" font-weight="750" letter-spacing="-0.6">Native Go clients</text>
      <text y="296" fill="#a1a1aa" font-size="18.5">
        <tspan x="0">No aql, redis-cli, or external</tspan>
        <tspan x="0" dy="29">database binaries.</tspan>
      </text>
    </g>

    <g transform="translate(1000)">
      <text y="250" fill="#fafafa" font-size="29" font-weight="750" letter-spacing="-0.6">Built for real output</text>
      <text y="296" fill="#a1a1aa" font-size="18.5">
        <tspan x="0">JSON, table, raw, counts, and</tspan>
        <tspan x="0" dy="29">virtualized large-result</tspan>
        <tspan x="0" dy="29">rendering.</tspan>
      </text>
    </g>
  </g>
</svg>
